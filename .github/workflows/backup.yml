name: Backup mingguan

# Backup database PRODUKSI (ARCHITECTURE §10): roles + skema + data (termasuk akun di auth),
# dienkripsi lalu disimpan sebagai artifact 90 hari. Cara memulihkan: ARCHITECTURE §10.
on:
  schedule:
    - cron: "0 19 * * 0" # Senin 02.00 WIB
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # Session pooler (IPv4) — runner GitHub tidak mendukung koneksi langsung (IPv6).
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Periksa secret
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Isi secret SUPABASE_DB_URL dan BACKUP_PASSPHRASE di Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dump (roles, skema, data)
        run: |
          mkdir backup
          pnpm exec supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          pnpm exec supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          pnpm exec supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
      - name: Enkripsi
        run: |
          NAMA="pantau-generus-$(date -u +%Y%m%d)"
          tar -czf "$NAMA.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$NAMA.tar.gz.gpg" "$NAMA.tar.gz"
          rm -rf backup "$NAMA.tar.gz"
          echo "NAMA=$NAMA" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAMA }}
          path: ${{ env.NAMA }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
