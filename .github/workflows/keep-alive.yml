name: Keep-alive Supabase

# Supabase Free menjeda proyek yang tidak aktif 7 hari (ARCHITECTURE §10). Satu permintaan ringan
# per hari ke API produksi sudah cukup; RLS membuat hasilnya kosong tanpa login.
on:
  schedule:
    - cron: "0 22 * * *" # 05.00 WIB
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Ping API
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Isi secret SUPABASE_URL dan SUPABASE_PUBLISHABLE_KEY (proyek produksi)."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $KEY" "$URL/rest/v1/kelompok?select=id&limit=1" > /dev/null
          echo "Supabase aktif."
